# Configuración de zram para densificar microVMs de kindling — OPT-IN.
#
# Esto NO es parte de kindling ni cambia su código: es una optimización del
# HOST. La lee el script packaging/zram-kindling.sh, que a su vez invoca la
# unidad packaging/zram-kindling.service. No se activa solo; hay que instalar y
# habilitar la unidad a mano (ver docs/densidad-zram.md).
#
# Por qué ayuda aquí: N instancias de un mismo snapshot dorado comparten por
# copy-on-write las páginas que NO han tocado. Las que sí divergen —el heap de
# node de cada invitado, sobre todo— son anónimas y muy repetitivas, así que
# comprimen de sobra (3x-4x es habitual). zram las guarda comprimidas en RAM en
# vez de empujarlas al disco: subes densidad sin pagar la latencia de un swap a
# NVMe. El coste es CPU del compresor y algo de latencia al descomprimir; por
# eso hay que MEDIRLO (docs/densidad-zram.md), no darlo por bueno.

# --- Algoritmo de compresión ---------------------------------------------
# zstd  = mejor ratio, descompresión un poco más cara. Es el que recomendamos:
#         el cuello de botella aquí es la RAM, no la CPU, y a más ratio caben
#         más microVMs.
# lz4   = ratio peor pero descompresión más rápida y barata en CPU. Elígelo si
#         al medir ves que el p99 de descongelado (thaw) sube demasiado o que
#         el compresor se come CPU que hace falta para los invitados.
# El kernel tiene que traer el algoritmo compilado; comprueba los disponibles
# con:  cat /sys/block/zram0/comp_algorithm
ZRAM_ALGO=zstd

# --- Tamaño lógico del dispositivo (disksize) ----------------------------
# Porcentaje de la RAM total que zram expone como "disco" de swap. Es capacidad
# LÓGICA (sin comprimir): con ratio 3x, un disksize del 50% de la RAM ocupa de
# verdad ~16% de RAM cuando se llena. No te pases: si lo pones enorme y el host
# se lo cree, puede admitir más carga de la que cabe físicamente y acabar en
# OOM. El 50% es un punto de partida conservador.
ZRAM_SIZE_PERCENT=50

# --- Tope físico de RAM para el pool comprimido (mem_limit) --------------
# Red de seguridad: por más que el disksize lógico sea grande, el pool de datos
# comprimidos NUNCA usará más de este porcentaje de la RAM física. Evita que un
# caso poco comprimible se coma toda la memoria. Debe ser < ZRAM_SIZE_PERCENT.
ZRAM_MEM_LIMIT_PERCENT=25

# --- Prioridad del swap ---------------------------------------------------
# Alta (100) para que el kernel prefiera zram frente a cualquier swap en disco
# que ya exista. Así lo comprimido en RAM se usa antes que tocar el NVMe.
ZRAM_PRIORITY=100

# --- Número de streams de compresión -------------------------------------
# Vacío = el kernel usa uno por CPU (su valor por defecto). Ponle un número si
# quieres limitar cuántos núcleos puede robar el compresor a los invitados.
ZRAM_STREAMS=

# Recordatorio operativo (NO lo aplica este fichero, es solo una nota):
# con zram conviene subir vm.swappiness (p.ej. 100) para que el kernel mueva
# páginas anónimas frías a zram con ganas —es barato— en vez de defenderlas.
#   sysctl vm.swappiness=100
