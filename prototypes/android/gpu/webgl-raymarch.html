<!doctype html>
<!-- Prueba de WebGL de docs/gpu.md (PoC de virgl, #95): raymarch a pantalla
     completa a la resolución física. Cada 5 s escribe los fps en la consola, que
     WebView manda a logcat ("chromium: [INFO:CONSOLE" ... "WEBGLFPS"). -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas><script>
const c = document.getElementById('c');
const gl = c.getContext('webgl', {antialias: false});
function size() {
  c.width = Math.round(innerWidth * devicePixelRatio);
  c.height = Math.round(innerHeight * devicePixelRatio);
  gl.viewport(0, 0, c.width, c.height);
}
const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const fs = `precision highp float;uniform vec2 r;uniform float t;
float sd(vec3 p){vec3 q=mod(p,4.)-2.;float s=length(q)-1.;
  float b=length(max(abs(q)-vec3(.7),0.))-.1;return min(s,b+.3*sin(t+p.z));}
vec3 nrm(vec3 p){vec2 e=vec2(.001,0.);return normalize(vec3(sd(p+e.xyy)-sd(p-e.xyy),
  sd(p+e.yxy)-sd(p-e.yxy),sd(p+e.yyx)-sd(p-e.yyx)));}
void main(){vec2 uv=(gl_FragCoord.xy*2.-r)/r.y;vec3 ro=vec3(0.,0.,t*2.);
  vec3 rd=normalize(vec3(uv,1.5));float d=0.;int hit=0;
  for(int i=0;i<96;i++){float h=sd(ro+rd*d);if(h<.001){hit=1;break;}d+=h;if(d>60.)break;}
  vec3 col=vec3(0.);if(hit==1){vec3 p=ro+rd*d;vec3 n=nrm(p);
  col=vec3(.4,.6,.9)*max(dot(n,normalize(vec3(1.,1.,-1.))),0.)+.1;col*=exp(-.04*d);}
  gl_FragColor=vec4(col,1.);}`;
function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.log('WEBGLERR ' + gl.getShaderInfoLog(s));
  return s;
}
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ur = gl.getUniformLocation(pr, 'r'), ut = gl.getUniformLocation(pr, 't');
size(); addEventListener('resize', size);
// ?passes=K dibuja la escena K veces por fotograma: fps x K = lo que da la GPU
// cuando 60 fps (vsync) ya no dice nada.
const passes = Math.max(1, parseInt(new URLSearchParams(location.search).get('passes') || '1', 10));
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
console.log('WEBGLINFO ' + c.width + 'x' + c.height + ' passes=' + passes + ' ' +
  (dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)));
let n = 0, t0 = performance.now();
function frame(now) {
  gl.uniform2f(ur, c.width, c.height); gl.uniform1f(ut, now / 1000);
  for (let i = 0; i < passes; i++) gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  n++;
  if (now - t0 >= 5000) { console.log('WEBGLFPS ' + (n * 1000 / (now - t0)).toFixed(1)); n = 0; t0 = now; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
