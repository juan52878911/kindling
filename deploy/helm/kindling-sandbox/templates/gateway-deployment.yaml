{{- if .Values.gateway.enabled }}
{{- $tls := include "kindling-sandbox.gatewayTLS" . }}
{{- $sd := .Values.gateway.stateDir }}
{{- $pvc := and $sd.path $sd.persistence.enabled }}
{{- $au := .Values.gateway.audit }}
{{- $otlp := .Values.gateway.otlp }}
{{- $apvc := and $au.path $au.persistence.enabled }}
{{- if and $au.persistence.enabled (not $au.path) }}{{ fail "gateway.audit.persistence.enabled exige gateway.audit.path" }}{{ end }}
{{- if and $apvc (gt (int .Values.gateway.replicas) 1) }}{{ fail "gateway.audit.persistence con más de una réplica: el PVC es ReadWriteOnce y cada réplica escribe su propio registro; usa replicas=1 o deja el registro en emptyDir" }}{{ end }}
{{- if and $au.path $sd.path (eq $au.path $sd.path) }}{{ fail "gateway.audit.path y gateway.stateDir.path no pueden ser el mismo directorio" }}{{ end }}
{{- if and $otlp.endpoint (not (regexMatch "^https?://[^/]+" $otlp.endpoint)) }}{{ fail "gateway.otlp.endpoint debe ser http(s)://host:puerto (OTLP/HTTP)" }}{{ end }}
{{- if and $sd.persistence.enabled (not $sd.path) }}{{ fail "gateway.stateDir.persistence.enabled exige gateway.stateDir.path" }}{{ end }}
{{- if and $sd.path (gt (int .Values.gateway.replicas) 1) }}{{ fail "gateway.stateDir con más de una réplica: el almacén de inquilinos es un fichero de un solo escritor; usa replicas=1" }}{{ end }}
{{- if not .Values.gateway.hosts }}{{ fail "gateway.hosts es obligatorio con gateway.enabled=true: sin hosts el gateway usaría un daemon local que en un Pod no existe" }}{{ end }}
{{- if and (not $tls) (not .Values.gateway.insecureListen) }}{{ fail "gateway: define gateway.tls.existingSecret, o gateway.insecureListen=true (HTTP plano; los tokens viajan en claro, solo tras un terminador TLS)" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kindling-sandbox.gatewayName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kindling-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  {{- if $pvc }}
  # El PVC es de un solo escritor (ReadWriteOnce): sin Recreate, la réplica
  # nueva no arrancaría hasta que la vieja soltara el volumen.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "kindling-sandbox.gatewaySelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kindling-sandbox.gatewaySelector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/gateway-configmap.yaml") . | sha256sum }}
        {{- with .Values.gateway.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if and $sd.path $sd.fsGroup }}
        fsGroup: {{ $sd.fsGroup }}
        {{- else if and $au.path $au.fsGroup }}
        fsGroup: {{ $au.fsGroup }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: {{ include "kindling-sandbox.gatewayImage" . | quote }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          command:
            {{- toYaml .Values.gateway.command | nindent 12 }}
          args:
            - -listen
            - {{ printf "0.0.0.0:%d" (int .Values.gateway.containerPort) | quote }}
            {{- if $tls }}
            - -tls-cert
            - /etc/kling/tls/tls.crt
            - -tls-key
            - /etc/kling/tls/tls.key
            {{- else }}
            - -insecure-listen
            {{- end }}
            {{- with .Values.gateway.image.defaultImage }}
            - -image
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.abandon }}
            - -abandon
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.limits.maxMemMiB }}
            - -max-mem-mib
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.limits.maxVCPUs }}
            - -max-vcpus
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.limits.maxMemTotalMiB }}
            - -max-mem-total-mib
            - {{ . | quote }}
            {{- end }}
            {{- with .Values.gateway.ingressDomain }}
            - -ingress-domain
            - {{ . | quote }}
            {{- if $.Values.gateway.ingressSecret.name }}
            - -ingress-secret-file
            - /etc/kling/ingress/{{ $.Values.gateway.ingressSecret.key }}
            {{- end }}
            {{- end }}
            {{- with $sd.path }}
            - -state-dir
            - {{ . | quote }}
            {{- end }}
            {{- with $otlp.endpoint }}
            - -otlp-endpoint
            - {{ . | quote }}
            {{- with $otlp.metricsInterval }}
            - -otlp-metrics-interval
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with $au.path }}
            - -audit-dir
            - {{ . | quote }}
            {{- with $au.maxMiB }}
            - -audit-max-mib
            - {{ . | quote }}
            {{- end }}
            {{- with $au.keep }}
            - -audit-keep
            - {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.gateway.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: KLING_CONFIG
              value: /etc/kling/config/config.json
            - name: KLING_SANDBOX_TENANTS
              valueFrom:
                secretKeyRef:
                  name: {{ required "gateway.tenants.existingSecret es obligatorio: Secret con la lista de tenants (nombre:token[:límites])" .Values.gateway.tenants.existingSecret }}
                  key: {{ .Values.gateway.tenants.key }}
            {{- with .Values.gateway.admins }}
            - name: KLING_SANDBOX_ADMINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if and $otlp.endpoint $otlp.headersSecret.name }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ $otlp.headersSecret.name }}
                  key: {{ $otlp.headersSecret.key }}
            {{- end }}
            {{- with .Values.gateway.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.gateway.containerPort }}
          readinessProbe:
            tcpSocket:
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/kling/config
              readOnly: true
            {{- if $tls }}
            - name: tls
              mountPath: /etc/kling/tls
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.ingressSecret.name }}
            - name: ingress
              mountPath: /etc/kling/ingress
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.ssh.existingSecret }}
            - name: ssh
              mountPath: {{ .Values.gateway.ssh.mountPath }}
              readOnly: true
            {{- end }}
            {{- if $sd.path }}
            - name: state
              mountPath: {{ $sd.path }}
            {{- end }}
            {{- if $au.path }}
            - name: audit
              mountPath: {{ $au.path }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "kindling-sandbox.gatewayName" . }}
        {{- if $tls }}
        - name: tls
          secret:
            secretName: {{ .Values.gateway.tls.existingSecret }}
        {{- end }}
        {{- if .Values.gateway.ingressSecret.name }}
        - name: ingress
          secret:
            secretName: {{ .Values.gateway.ingressSecret.name }}
        {{- end }}
        {{- if .Values.gateway.ssh.existingSecret }}
        - name: ssh
          secret:
            secretName: {{ .Values.gateway.ssh.existingSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if $sd.path }}
        - name: state
          {{- if $pvc }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-state" (include "kindling-sandbox.gatewayName" .)) $sd.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- if $au.path }}
        - name: audit
          {{- if $apvc }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-audit" (include "kindling-sandbox.gatewayName" .)) $au.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
