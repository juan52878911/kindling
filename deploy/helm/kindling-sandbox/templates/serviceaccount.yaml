{{- if and .Values.operator.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kindling-sandbox.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kindling-sandbox.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
