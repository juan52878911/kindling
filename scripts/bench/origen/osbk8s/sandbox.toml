# OpenSandbox 1.2.1 con runtime kubernetes (k3s en la VM 112); servidor fuera del clúster.
[server]
host = "127.0.0.1"
port = 18080
max_sandbox_timeout_seconds = 86400
[log]
level = "WARNING"
[runtime]
type = "kubernetes"
execd_image = "opensandbox/execd:v1.1.0"
[storage]
allowed_host_paths = []
volume_default_size = "1Gi"
[store]
type = "sqlite"
path = "/root/.opensandbox/opensandbox.db"
[kubernetes]
kubeconfig_path = "/etc/rancher/k3s/k3s.yaml"
namespace = "opensandbox"
informer_resync_seconds = 300
informer_watch_timeout_seconds = 60
workload_provider = "batchsandbox"
image_pull_policy = "IfNotPresent"
batchsandbox_template_file = "/root/osbk8s/batchsandbox-template.yaml"
[ingress]
mode = "direct"
[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns"
[renew_intent]
enabled = false
min_interval_seconds = 60
