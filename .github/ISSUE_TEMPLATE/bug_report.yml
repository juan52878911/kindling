name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. Two commands give us most of what we need; please paste their output as is.
  - type: textarea
    id: doctor
    attributes:
      label: Output of `kling doctor`
      description: Run `kling doctor` (add `NO_COLOR=1` if the marks come out garbled) and paste everything.
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `kling status -v`
      render: text
    validations:
      required: false
  - type: textarea
    id: what
    attributes:
      label: What you ran and what happened
      description: The exact command, what it printed (including the `try:` line, if any), and what you expected instead.
      placeholder: |
        $ kling run -image toolchain -name sb
        error: ...
        try: ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where the daemon runs
      options:
        - Linux, bare metal
        - Linux, VM with nested virtualization (Proxmox, Lima, ...)
        - macOS, Apple Silicon (vz backend)
        - Kubernetes operator
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `kling version`; if from source, the commit.
      placeholder: kling 0.14.0 / daemon 0.14.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, if relevant
      description: "`kling logs <ref>` for a machine, `journalctl -u kling` for the daemon, the gateway's stderr. Remove tokens and secrets."
      render: text
