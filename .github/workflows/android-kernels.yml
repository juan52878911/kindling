# Construye los kernels Android del prototipo (arm64 para vz en Apple Silicon,
# amd64 para Firecracker en x86_64), con su sha256, su .config y su
# .buildinfo. Así nadie necesita una VM Linux para compilar el kernel: se baja
# de la release y se comprueba (prototypes/android/docs/constructor.md,
# "Kernels").
#
# Lo llama release.yml (workflow_call) y deja los ficheros como artefactos del
# run: el job release los mete en la lista de assets esperados, en
# SHA256SUMS (y su firma) y en la atestación de procedencia, como todo lo
# demás. Antes escuchaba `release: published`, pero una release creada con el
# GITHUB_TOKEN no dispara workflows: no corrió nunca. A mano
# (workflow_dispatch) solo construye, para probar el kernel sin publicar nada.
#
# El tarball de kernel.org se comprueba contra la lista sha256sums.asc FIRMADA
# (claves de Linus, Greg y el autosigner de kernel.org, por WKD) antes de
# compilar; si kernel.pin trae el sha256 fijado, tienen que coincidir.
name: android-kernels

on:
  workflow_call:
    inputs:
      ref:
        description: 'commit o etiqueta de la que construir'
        type: string
        required: true
  workflow_dispatch:

# Lectura por defecto; la escritura, solo en el job que la necesita.
permissions:
  contents: read

jobs:
  kernel:
    name: kernel android ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison bc libelf-dev xz-utils curl gnupg gcc-aarch64-linux-gnu

      - name: kernel.org tarball sha256 (signed list)
        id: ksha
        shell: bash
        run: |
          set -euo pipefail
          . scripts/builders/kernel/kernel.pin
          curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors -o sha256sums.asc "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_VERSION%%.*}.x/sha256sums.asc"
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          gpg --batch --quiet --auto-key-locate clear,wkd --locate-keys \
            torvalds@kernel.org gregkh@kernel.org autosigner@kernel.org
          gpg --batch --verify sha256sums.asc
          sum="$(awk -v f="linux-$KERNEL_VERSION.tar.xz" '$2 == f {print $1}' sha256sums.asc)"
          [[ "$sum" =~ ^[0-9a-f]{64}$ ]] || { echo "no signed sha256 for linux-$KERNEL_VERSION" >&2; exit 1; }
          if [ -n "${KERNEL_SHA256:-}" ] && [ "$KERNEL_SHA256" != "$sum" ]; then
            echo "kernel.pin says $KERNEL_SHA256, the signed list says $sum" >&2; exit 1
          fi
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "linux-$KERNEL_VERSION.tar.xz: $sum (signed list verified)"

      - name: build
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          KERNEL_SHA256: ${{ steps.ksha.outputs.sha256 }}
          OUT: ${{ github.workspace }}/dist
        run: prototypes/android/kernel/build.sh

      # Sin --clobber ni subida aquí: release.yml los publica con el resto.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-kernel-${{ matrix.arch }}
          path: |
            dist/vmlinux-*-android
            dist/vmlinux-*-android.sha256
            dist/vmlinux-*-android.config
            dist/vmlinux-*-android.buildinfo
          if-no-files-found: error
