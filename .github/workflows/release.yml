# Publica una release a partir de una etiqueta vX.Y.Z.
#
# Desde v0.13.0 una sola etiqueta publica TODO lo del repo: el núcleo (kling,
# kling-guest, kling-chispa, kling-vz, kling-hv), las extensiones (kling-mcp y su puente,
# kling-sandbox), el operador de Kubernetes y los tar de lo que
# se instala en el host del daemon, con UN único SHA256SUMS. Antes cada repo
# tenía su release y su SHA256SUMS y había que cruzar tablas de compatibilidad;
# ahora todo lo de una release es compatible entre sí, y `kling plugins install`
# baja kling-<n>-<os>-<arch> de la misma etiqueta que el kling que lo pide.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        # Obligatoria: sin ella GITHUB_REF_NAME sería el nombre de una rama y la
        # release saldría con ese nombre.
        description: 'tag a publicar (ej. v0.13.0); tiene que existir ya'
        required: true

# Lectura por defecto: solo el job que publica la release pide escritura.
permissions:
  contents: read

jobs:
  # Nada se publica sin pasar los mismos tests que el CI (gofmt, vet y
  # test -race -count=1 de cada módulo), sobre el commit de la etiqueta.
  test:
    name: make test (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        dir: [., ext/db, ext/mcp, ext/phone, ext/sandbox]
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.mod
      - name: make test
        env:
          DIR: ${{ matrix.dir }}
        run: make -C "$DIR" test

  build:
    name: build ${{ matrix.os }}/${{ matrix.arch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
        # Windows queda fuera: internal/machine usa syscall.Kill, Setsid y
        # Stat_t que son POSIX. Un binario para Windows sería humo.
    env:
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
      CGO_ENABLED: '0'
      # Cada módulo por su replace ../.., sin workspace: es como compila el
      # Dockerfile del operador y como lo haría quien clona la etiqueta.
      GOWORK: 'off'
      GOTOOLCHAIN: local

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # La toolchain con la que se compila lo publicado, no el mínimo de los
          # go.mod (go 1.24): la stdlib va dentro del binario y sus CVE con ella.
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.mod
            ext/*/go.mod

      - name: compute version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_TAG"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "tag con forma inesperada: $VERSION" >&2; exit 1; }
          # Sin la v para -X main.Version: todos los binarios informan igual.
          echo "version=${VERSION}"  >> "$GITHUB_OUTPUT"
          echo "ldver=${VERSION#v}"  >> "$GITHUB_OUTPUT"

      # Un solo paso con una función: los binarios se compilan igual y así
      # no hay un bloque por binario que se desincronice. `go -C` entra en el módulo de
      # cada extensión; por eso la salida va con ruta absoluta.
      - name: build
        shell: bash
        env:
          LDFLAGS: -s -w -X main.Version=${{ steps.ver.outputs.ldver }}
        run: |
          set -euo pipefail
          mkdir -p dist
          DIST="$PWD/dist"
          plat="${GOOS}-${GOARCH}"
          b() { # b <módulo> <paquete> <nombre>
            echo "  $3-$plat"
            go -C "$1" build -trimpath -ldflags "$LDFLAGS" -o "$DIST/$3-$plat" "$2"
          }
          # CLI y daemon son el mismo binario (el unit de systemd lo invoca con
          # `kling daemon`), así que kling-linux-<arch> sirve para las dos cosas.
          b .           ./cmd/kling                              kling
          b ext/mcp     ./cmd/kling-mcp                          kling-mcp
          # El puente va dentro de las microVMs (linux) y en local para
          # `kling mcp link` (también darwin).
          b ext/mcp     ./cmd/kling-bridge                       kling-bridge
          b ext/sandbox ./cmd/kling-sandbox                      kling-sandbox
          b ext/db      ./cmd/kling-db                           kling-db
          b ext/phone   ./cmd/kling-phone                        kling-phone
          if [ "$GOOS" = linux ]; then
            # Invitados de las microVMs y el operador, que solo corre en un clúster.
            b .           ./cmd/kling-guest                      kling-guest
            b .           ./cmd/kling-chispa                     kling-chispa
            b ext/sandbox ./cmd/kindling-operator                kindling-operator
          fi
          ls -la dist/

      - name: upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # kling-vz y kling-hv (los VMM nativos de macOS) necesitan cgo y la firma
  # con el entitlement de su framework: solo se pueden compilar en un runner
  # macOS. macos-15 porque kling-hv usa la API GIC de Hypervisor.framework,
  # que no trae el SDK de 14. No se vuelve a tocar el binario tras build.sh o
  # build-hv.sh (strip, re-firma): se perdería el entitlement.
  vz:
    name: build kling-vz and kling-hv darwin/arm64
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Como en build: la toolchain parcheada, no el mínimo de vz/go.mod.
          go-version: '1.27.3'
          cache-dependency-path: vz/go.sum
      - name: build y firma
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$INPUT_TAG"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME}"
          # Sin fijarlo, el enlazador marca el binario con la versión del SDK
          # del runner (15.x) y dyld se niega a cargarlo en un macOS anterior:
          # kling-vz vale desde 14.0 y kling-hv desde 15.2 (docs/mac.md).
          minos() { otool -l "$1" | grep -A4 LC_BUILD_VERSION | grep -q "minos $2\$" || { echo "$1 is not built for macOS $2" >&2; exit 1; }; }
          cd vz
          MACOSX_DEPLOYMENT_TARGET=14.0 CGO_CFLAGS="-O2 -g -mmacosx-version-min=14.0" CGO_LDFLAGS="-mmacosx-version-min=14.0" \
            OUT=dist/kling-vz-darwin-arm64 VERSION="$VERSION" ./build.sh
          codesign -d --entitlements - dist/kling-vz-darwin-arm64 2>&1 | grep -q com.apple.security.virtualization
          minos dist/kling-vz-darwin-arm64 14.0
          MACOSX_DEPLOYMENT_TARGET=15.2 CGO_CFLAGS="-O2 -g -mmacosx-version-min=15.2" CGO_LDFLAGS="-mmacosx-version-min=15.2" \
            OUT=dist/kling-hv-darwin-arm64 VERSION="$VERSION" ./build-hv.sh
          codesign -d --entitlements - dist/kling-hv-darwin-arm64 2>&1 | grep -q com.apple.security.hypervisor
          minos dist/kling-hv-darwin-arm64 15.2
          dist/kling-hv-darwin-arm64 --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vmm-darwin-arm64
          path: |
            vz/dist/kling-vz-darwin-arm64
            vz/dist/kling-hv-darwin-arm64
          if-no-files-found: error

  # El kernel de invitado y la imagen min de las dos arquitecturas: un Mac sin
  # host Linux los baja con `kling up` (docs/mac.md) en vez de copiarlos de otro
  # daemon. El kernel es reproducible (scripts/builders/kernel, cruzado para
  # arm64) y min no instala paquetes (no hay chroot), así que los dos salen de
  # un runner x86_64. min lleva horneado el kling-bridge de la misma release.
  imagenes:
    name: guest kernel and min image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-linux-*
          path: bins
          merge-multiple: true
      - name: herramientas
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential flex bison bc libelf-dev xz-utils curl gcc-aarch64-linux-gnu e2fsprogs zstd
      - name: kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            TARGET_ARCH="$arch" OUT="$PWD/kout" scripts/builders/kernel/build.sh
            n="$(TARGET_ARCH="$arch" scripts/builders/kernel/build.sh --print-name)"
            zstd -19 -T0 -q -o "dist/vmlinux-$arch.zst" "kout/$n"
          done
      - name: min
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            case "$arch" in amd64) a=x86_64 ;; arm64) a=aarch64 ;; esac
            chmod 755 "bins/kling-bridge-linux-$arch"
            sudo env KLING_ROOT="$PWD/img-$arch" ALPINE_ARCH="$a" BRIDGE="$PWD/bins/kling-bridge-linux-$arch" \
              scripts/70-build-minimal-image.sh min
            # Root la dejó: se lee con sudo y el .zst es del runner.
            sudo cat "img-$arch/images/min.ext4" | zstd -19 -T0 -q -o "dist/min-$arch.ext4.zst"
          done
          ls -la dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: imagenes
          path: dist/*
          if-no-files-found: error

  release:
    name: release
    needs: [build, vz, imagenes]
    runs-on: ubuntu-latest
    # El único job que escribe en el repo: crea la release y sube los assets.
    # Corre en el environment protegido `release`, el único con el secreto
    # KLING_RELEASE_SIGNING_KEY (docs/firmas.md).
    environment: release
    permissions:
      contents: write
      id-token: write     # la atestación de procedencia (Sigstore, sin claves)
      attestations: write
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: compute version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$INPUT_TAG"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          # Todos los binarios sueltos en release/, sin un directorio por job.
          merge-multiple: true

      # Lo que `make deploy` instala en el host del daemon, para quien no clona
      # el repo. Las rutas dentro de cada tar son las mismas que tenían en los
      # repos kindling-mcp y kindling-sandbox (scripts/, packaging/, deploy/),
      # así que las recetas que ya los desempaquetaban siguen valiendo.
      - name: tar del host y del operador
        run: |
          set -eu
          tar -czf release/kindling-mcp-host.tar.gz -C ext/mcp \
            scripts/80-mcp-image.sh scripts/builders/mcp packaging/
          tar -czf release/kindling-sandbox-host.tar.gz -C ext/sandbox packaging/
          tar -czf release/kindling-operator-deploy.tar.gz -C ext/sandbox deploy/

      # La lista del contrato de assets, escrita una vez: si un binario falta
      # (un paso que no compiló, un nombre cambiado) la release no sale a
      # medias, y si sobra algo tampoco se publica sin que nadie lo decida.
      - name: comprobar la lista de assets
        shell: bash
        run: |
          set -euo pipefail
          want=()
          for os in linux darwin; do
            for arch in amd64 arm64; do
              for n in kling kling-mcp kling-bridge kling-sandbox kling-db kling-phone; do
                want+=("$n-$os-$arch")
              done
            done
          done
          for arch in amd64 arm64; do
            want+=("kling-guest-linux-$arch" "kling-chispa-linux-$arch" "kindling-operator-linux-$arch")
          done
          for arch in amd64 arm64; do
            want+=("vmlinux-$arch.zst" "min-$arch.ext4.zst")
          done
          want+=(kling-vz-darwin-arm64 kling-hv-darwin-arm64 kindling-mcp-host.tar.gz kindling-sandbox-host.tar.gz kindling-operator-deploy.tar.gz)
          printf '%s\n' "${want[@]}" | sort > want.txt
          (cd release && ls -1) | sort > have.txt
          if ! diff -u want.txt have.txt; then
            echo "los assets no coinciden con el contrato (- falta, + sobra)" >&2
            exit 1
          fi
          echo "${#want[@]} assets"

      - name: compute SHA256SUMS
        working-directory: release
        run: |
          # Un solo SHA256SUMS para toda la release: install.sh y
          # `kling plugins install` verifican contra él antes de escribir nada.
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      # La fórmula de Homebrew con la versión y los sha256 de esta release,
      # como un asset más (no se publica en ningún tap). Va después de
      # SHA256SUMS porque sale de él, y su propia suma se añade al final.
      - name: fórmula de Homebrew
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eu
          packaging/homebrew/formula.sh "$VERSION" release/SHA256SUMS > release/kling.rb
          (cd release && sha256sum kling.rb >> SHA256SUMS)
          cat release/kling.rb

      # Para `go run ./internal/upgrade/firmar` (solo stdlib, sin caché).
      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false

      # Firma el SHA256SUMS ya completo (con kling.rb) en el formato de
      # minisign: kling upgrade, kling up e install.sh la comprueban con las
      # claves de internal/upgrade/firma.go. Sin el secreto (la clave aún no
      # existe) se salta con un aviso y la release sale sin firmar, como antes;
      # desde v1.0.0 los clientes la rechazarían, así que ahí falla.
      - name: firmar SHA256SUMS
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          KLING_RELEASE_SIGNING_KEY: ${{ secrets.KLING_RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "$KLING_RELEASE_SIGNING_KEY" ]; then
            case "$VERSION" in
              v0.*) echo "::warning::KLING_RELEASE_SIGNING_KEY no está en el environment release: $VERSION sale sin SHA256SUMS.minisig (docs/firmas.md)"
                    exit 0 ;;
            esac
            echo "::error::$VERSION tiene que ir firmada y falta KLING_RELEASE_SIGNING_KEY (docs/firmas.md)"
            exit 1
          fi
          go run ./internal/upgrade/firmar sign -tag "$VERSION" -in release/SHA256SUMS
          go run ./internal/upgrade/firmar verify -tag "$VERSION" -in release/SHA256SUMS
          cat release/SHA256SUMS.minisig

      # Procedencia SLSA de cada asset (firma, fórmula y SHA256SUMS incluidos)
      # con el OIDC del job: se comprueba con `gh attestation verify`.
      - name: atestación de procedencia
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*

      - name: generate release notes
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          # El bloque de esta versión del CHANGELOG y una línea de instalación;
          # sin bloque, la release no se publica.
          scripts/release-notes.sh "$VERSION" CHANGELOG.md > notes.md
          cat notes.md

      - name: create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          body_path: notes.md
          fail_on_unmatched_files: true
          # La lista ya se comprobó arriba contra el contrato.
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # La imagen del operador en GHCR, para las dos arquitecturas: es la que
  # referencia ext/sandbox/deploy/deployment.yaml. La ruta no cambia con la
  # unificación porque la imagen se llama por el paquete, no por el repo.
  imagen:
    # Después de la release: si fallan los binarios o la release, no se publica
    # una imagen de una versión que no existe.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: versión
        id: ver
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ldver=${VERSION#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          # Contexto en la raíz: el go.mod de ext/sandbox tiene replace ../.. y
          # necesita el núcleo del mismo commit.
          context: .
          file: ext/sandbox/Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          # Sin la v, como en los binarios sueltos: el mismo operador informa de
          # la misma versión venga de donde venga.
          build-args: VERSION=${{ steps.ver.outputs.ldver }}
          tags: |
            ghcr.io/juan52878911/kindling-operator:${{ steps.ver.outputs.version }}
            ghcr.io/juan52878911/kindling-operator:latest
