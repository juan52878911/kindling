# Comprobaciones en cada push. Separado de release.yml, que solo corre con tags.
#
# Existe porque el repo llegó a tener 1.300 líneas de test que ningún automatismo
# ejecutaba: `make test` era vet + build, y el workflow de release ni eso. Los dos
# peores fallos que se encontraron revisando la rama de rendimiento eran carreras
# de datos — exactamente lo que `-race` habría cazado el mismo día.
#
# Desde v0.13.0 el repo tiene varios módulos (núcleo, ext/mcp, ext/sandbox y vz).
# Cada uno trae su Makefile con `test` (gofmt + vet + test -race) y `cross` (sus
# compilaciones cruzadas): el CI solo los llama, para que lo que corre aquí sea
# exactamente lo que cualquiera corre en local antes de empujar.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  modulo:
    name: make test cross (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [., ext/db, ext/mcp, ext/phone, ext/sandbox]
    env:
      # Sin workspace: así compila quien clona sin go.work, el Dockerfile del
      # operador y `go install`. Los ext/* llegan al núcleo por su replace ../..,
      # y con el go.work puesto un replace roto pasaría desapercibido. El camino
      # con workspace lo comprueba el job `workspace`.
      GOWORK: 'off'
      # Que Go no se baje otra toolchain por su cuenta. Se prueba con la misma
      # toolchain con la que publica release.yml (1.27.x, con los CVE de la
      # stdlib corregidos); el mínimo que declaran los go.mod (go 1.24) lo
      # sigue comprobando el job raiz-sin-deps.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: ${{ matrix.dir }}/go.mod

      # Para la prueba cruzada de firmas con el minisign de verdad
      # (internal/upgrade/minisign_test.go; sin él se salta).
      - name: instalar minisign
        if: matrix.dir == '.'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: make test cross
        env:
          DIR: ${{ matrix.dir }}
        run: make -C "$DIR" test cross

  # El go.mod del núcleo no tiene dependencias ni cgo, y es una promesa: el
  # binario se instala copiándolo, y cualquier require nuevo lo tiene que decidir
  # alguien a propósito, no colarse con un `go get`. Los ext/* sí podrían tener
  # dependencias, pero su replace al núcleo del mismo commit es obligatorio.
  raiz-sin-deps:
    name: núcleo sin dependencias ni cgo
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # A propósito la 1.24 y no la de release: este job comprueba que el
          # mínimo que declaran los go.mod sigue compilando el núcleo.
          go-version: '1.24'
          cache: false

      - name: go.mod sin require ni replace
        run: |
          if grep -nE '^\s*(require|replace)' go.mod; then
            echo "el go.mod raíz no puede tener require ni replace" >&2
            exit 1
          fi

      - name: CGO_ENABLED=0 go build ./...
        run: CGO_ENABLED=0 go build ./...

      # La release y los e2e ejecutan los scripts directamente: sin el bit de
      # ejecución en git fallan con "Permission denied" (pasó en v0.20.0). Los
      # lib-*.sh y minimal-init.sh se cargan o se copian, no se ejecutan.
      - name: scripts ejecutables
        run: |
          malos=$(git ls-files -s '*.sh' \
            | awk '$1 == "100644" { print $4 }' \
            | grep -vE '(^|/)(lib-[^/]*|minimal-init)\.sh$' || true)
          if [ -n "$malos" ]; then
            echo "scripts sin bit de ejecución (git update-index --chmod=+x):" >&2
            echo "$malos" >&2
            exit 1
          fi

      - name: ext/* apuntan al núcleo del mismo commit
        run: |
          for m in ext/*/go.mod; do
            grep -qE '^replace github.com/juan52878911/kindling => \.\./\.\.$' "$m" || {
              echo "$m: falta 'replace github.com/juan52878911/kindling => ../..'" >&2
              exit 1
            }
          done

      # La directiva go de cada ext/* es la del núcleo: es el mínimo que se
      # promete y con el que compila este job (go 1.24, GOTOOLCHAIN=local). El
      # go.work declara otra (la de vz/go.mod), y eso no cuenta aquí.
      - name: ext/* declaran la misma versión de Go que el núcleo
        run: |
          want=$(grep -E '^go [0-9]' go.mod)
          for m in ext/*/go.mod; do
            got=$(grep -E '^go [0-9]' "$m")
            [ "$got" = "$want" ] || {
              echo "$m: '$got', y el núcleo declara '$want'" >&2
              exit 1
            }
          done

  # kling-unpack (rust/kling-unpack) descomprime las capas fuera del núcleo:
  # aquí se compila con su Cargo.lock y se comprueba contra el camino de Go
  # (mismos bytes, mismos fallos) con capas buenas, dañadas y hostiles.
  kling-unpack:
    name: kling-unpack (Rust)
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - run: cargo fmt --check --manifest-path rust/kling-unpack/Cargo.toml
      - run: cargo clippy --locked --manifest-path rust/kling-unpack/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path rust/kling-unpack/Cargo.toml
      - run: go test -race -count=1 -run UnpackHelper -v ./internal/oci
        env:
          KLING_UNPACK_TEST: ${{ github.workspace }}/rust/kling-unpack/target/release/kling-unpack

  # El go.work comiteado es la comodidad de local: un cambio en pkg/api rompe
  # ext/mcp en el mismo `go build`. Si go.work o go.work.sum se quedan atrás (un
  # módulo nuevo sin `use`, una suma que falta), aquí se ve.
  workspace:
    name: go.work
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # La de release; go.work declara la mínima que exige vz/go.mod.
          go-version: '1.27.3'
          cache: false
      # vz queda fuera del build: es cgo y solo de macOS (lo compila el job vz).
      # Su go.mod sí entra en el grafo del workspace, así que de paso se
      # comprueba que sus sumas estén en go.work.sum.
      - run: go build ./... ./ext/db/... ./ext/mcp/... ./ext/phone/... ./ext/sandbox/...
      - run: go vet ./ext/db/... ./ext/mcp/... ./ext/phone/... ./ext/sandbox/...
      # La directiva go del go.work es la de vz/go.mod (lo dice su comentario):
      # si vz sube la suya y el go.work no, `go build` en local con el
      # workspace se niega o baja otra toolchain.
      - name: go.work declara la versión de Go de vz/go.mod
        run: |
          want=$(grep -E '^go [0-9]' vz/go.mod)
          got=$(grep -E '^go [0-9]' go.work)
          [ "$got" = "$want" ] || {
            echo "go.work: '$got', y vz/go.mod declara '$want'" >&2
            exit 1
          }

  # El clon de volúmenes (reflink) no se puede probar sobre el ext4 del runner:
  # ahí solo se ejercita el rechazo. Este job monta un XFS y un btrfs en loop y
  # corre los tests de clonado CON TMPDIR dentro, para que el FICLONE sea de
  # verdad y no el doble de los tests. El `-v | grep` exige que el clon real
  # haya ocurrido: un test que pasa porque el sistema de ficheros "no clona"
  # aquí sería un falso verde.
  clon-reflink:
    name: clon real (${{ matrix.fs }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fs: [xfs, btrfs]
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true
      - name: montar ${{ matrix.fs }} en loop
        run: |
          sudo apt-get install -y -qq xfsprogs btrfs-progs >/dev/null
          truncate -s 1G "$RUNNER_TEMP/fs.img"
          if [ "${{ matrix.fs }}" = xfs ]; then
            mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/fs.img"
          else
            mkfs.btrfs -q "$RUNNER_TEMP/fs.img"
          fi
          sudo mkdir -p /mnt/clon
          sudo mount -o loop "$RUNNER_TEMP/fs.img" /mnt/clon
          sudo chown "$(id -u):$(id -g)" /mnt/clon
      - name: tests de clonado sobre ${{ matrix.fs }}
        run: |
          set -o pipefail
          TMPDIR=/mnt/clon go test -count=1 -v -run 'Clon|Clone|Sonda' ./internal/machine/ ./internal/daemon/ | tee clon.log
          if grep -q 'no clona' clon.log; then echo "el clon real no ocurrió" >&2; exit 1; fi
          grep -q 'clon real con reflink' clon.log
          grep -q 'clona con FICLONE' clon.log

  # kling-vz es un módulo aparte con cgo: `./...` en la raíz no entra en vz/, y
  # solo compila de verdad en macOS. Sus tests no arrancan ninguna VM (la VM es
  # una interfaz con un doble), así que valen en un runner sin virtualización.
  vz:
    name: kling-vz and kling-hv (macOS)
    # macos-15: kling-hv (vz/internal/hvvm) usa la API GIC de
    # Hypervisor.framework, que solo trae el SDK de macOS 15.
    runs-on: macos-15
    defaults:
      run:
        working-directory: vz
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: vz/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=linux go vet ./...
      - run: go test -race -count=1 ./...
      # Las pruebas de C de kling-hv (prueba.c, RAM de mentira, sin VM ni
      # entitlement) con ASan y UBSan. Con tope: en macOS 26.5 el runtime de
      # ASan se cuelga al arrancar (scripts/sanitizers-hv.sh); si el runner
      # llegara a eso, que falle por tiempo y no se quede la hora entera.
      - name: kling-hv C tests with ASan and UBSan
        run: ./scripts/sanitizers-hv.sh
        timeout-minutes: 15
      # El fuzz de las colas virtio, corto: aleatorio puro (Go no ve la
      # cobertura del C), así que 30 s por commit suman con el tiempo.
      - name: FuzzColas (30 s)
        run: go test -run '^$' -fuzz '^FuzzColas$' -fuzztime 30s ./internal/hvvm/
        timeout-minutes: 5
      # Lo que encuentre el fuzz queda en testdata/fuzz: se guarda para
      # reproducirlo en local (go test -run FuzzColas/<id>).
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-colas
          path: vz/internal/hvvm/testdata/fuzz
          if-no-files-found: ignore
      # vz es cgo y solo de macOS: su govulncheck va aquí y no en lint.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # El mínimo de macOS de cada VMM se fija como en release.yml: sin él
      # el binario pediría la versión del SDK del runner.
      - run: ./build.sh
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
          CGO_CFLAGS: -O2 -g -mmacosx-version-min=14.0
          CGO_LDFLAGS: -mmacosx-version-min=14.0
      # Sin el entitlement el framework se niega a crear la VM: que la firma lo
      # lleve es parte del contrato del binario.
      - run: codesign -d --entitlements - bin/kling-vz 2>&1 | grep -q com.apple.security.virtualization
      - run: otool -l bin/kling-vz | grep -A4 LC_BUILD_VERSION | grep -q 'minos 14.0$'
      - run: bin/kling-vz --version
      - run: ./build-hv.sh
        env:
          MACOSX_DEPLOYMENT_TARGET: '15.2'
          CGO_CFLAGS: -O2 -g -mmacosx-version-min=15.2
          CGO_LDFLAGS: -mmacosx-version-min=15.2
      - run: codesign -d --entitlements - bin/kling-hv 2>&1 | grep -q com.apple.security.hypervisor
      - run: otool -l bin/kling-hv | grep -A4 LC_BUILD_VERSION | grep -q 'minos 15.2$'
      - run: bin/kling-hv --version
      # La sonda que mira `daemon.vmm auto`. Los runners de GitHub son VMs sin
      # virtualización anidada (kern.hv_support 0): ahí hv_vm_create no puede
      # ir bien, y lo que se comprueba es que la sonda conteste con su código
      # 1 y el motivo en vez de colgarse o morir de una señal, que es lo que
      # el daemon necesita para caer a vz. Con hipervisor tiene que dar "ok".
      - name: kling-hv --probe
        timeout-minutes: 2
        run: |
          hv=$(sysctl -n kern.hv_support 2>/dev/null || echo 0)
          rc=0
          out=$(bin/kling-hv --probe 2>&1) || rc=$?
          echo "kern.hv_support=$hv; kling-hv --probe: exit $rc: $out"
          if [ "$hv" = 1 ]; then
            [ "$rc" -eq 0 ] && [ "$out" = ok ]
          else
            [ "$rc" -eq 1 ] || { echo "::error::kling-hv --probe exited $rc (want 1 without a hypervisor)"; exit 1; }
            case "$out" in
              *"hv_vm_create failed"*|*"hv_gic_create failed"*) ;;
              *) echo "::error::kling-hv --probe did not say why it failed: $out"; exit 1 ;;
            esac
            echo "::notice::no hypervisor on this runner (kern.hv_support=$hv): the probe answered \"$out\""
          fi

  # El clon en macOS es clonefile de APFS. El disco del runner es APFS, así que
  # aquí el clon es de verdad. Además corren enteros el núcleo y ext/sandbox:
  # los tests _vz, _darwin, con //go:build darwin y las ramas GOOS == "darwin"
  # (cmd/kling, internal/share, internal/transport, internal/durable,
  # pkg/plugin, el terminal de kling-sandbox) no corren en ningún otro sitio;
  # antes solo internal/machine e internal/daemon. No arrancan ninguna VM (el
  # VMM es un doble), así que valen en un runner sin virtualización. En
  # macos-15, unos 7,5 min (antes 2), algo más que el job vz en paralelo.
  clon-apfs:
    name: clon real (apfs)
    runs-on: macos-15
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache: true
      - run: |
          set -o pipefail
          go test -count=1 -v -run 'Clon|Clone|Sonda' ./internal/machine/ ./internal/daemon/ | tee clon.log
          grep -q 'clon real con clonefile' clon.log
      - run: go test -race -count=1 ./...
      - run: go -C ext/sandbox test -race -count=1 ./...

  # Lo que no es un test pero caza fallos: vulnerabilidades conocidas en lo que
  # se llama de verdad (govulncheck), análisis estático (staticcheck, con la
  # configuración de staticcheck.conf, en Linux y macOS a la vez para que lo
  # usado en una sola plataforma no salga como muerto), shellcheck de los
  # scripts y la API Go pública contra la etiqueta anterior (scripts/apidiff.sh).
  # Las herramientas van fijadas: una versión nueva que encuentre más cosas
  # tiene que entrar con su commit, no romper main un martes.
  lint:
    name: lint (govulncheck, staticcheck, shellcheck, apidiff)
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # apidiff compara con la etiqueta anterior: hacen falta las etiquetas.
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # La de release: govulncheck mira la stdlib de esta toolchain.
          go-version: '1.27.3'
          cache: false
      - name: herramientas
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: govulncheck
        run: |
          for d in . ext/db ext/mcp ext/phone ext/sandbox; do
            echo "== $d"
            (cd "$d" && govulncheck ./...)
          done
      - name: staticcheck
        run: |
          for d in . ext/db ext/mcp ext/phone ext/sandbox; do
            echo "== $d"
            (cd "$d" && printf 'linux: GOOS=linux\ndarwin: GOOS=darwin\nlinuxarm64: GOOS=linux GOARCH=arm64\n' | staticcheck -matrix ./...)
          done
      # Solo avisos y errores: SC2015 (A && B || C) es el patrón de todas las
      # comprobaciones de los e2e, donde ok y bad siempre salen con 0; más de
      # 500 avisos de estilo no dirían nada.
      - name: shellcheck
        run: shellcheck --version | head -2 && shellcheck -x -S warning scripts/*.sh
      - name: apidiff (pkg/api, pkg/plugin, pkg/config)
        run: bash scripts/apidiff.sh
