# staticcheck (ci.yml, job lint), para todos los módulos del repo: los
# análisis por defecto menos ST1005. ST1005 pide errores en minúscula y sin
# punto final; los de kindling son frases para quien usa la CLI (algunos
# acaban con la orden que lo arregla en otra línea) y su texto ya lo fijan
# los tests y docs/api.md.
checks = ["inherit", "-ST1005"]
