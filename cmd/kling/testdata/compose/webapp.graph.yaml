# Generated by kling graph from-compose. Run these first:
#   kling volume create shop-pgdata
#   kling image import redis:7-alpine -name shop-cache -replace -- redis-server --maxmemory 64mb
#   kling image import postgres:16-alpine -name shop-db -replace -e POSTGRES_DB=shop -e POSTGRES_PASSWORD=s3cret -e POSTGRES_USER=shop -e PGDATA=/var/lib/postgresql/data/pgdata
#   kling image import ghcr.io/example/shop-web:1.4 -name shop-web -replace -e DATABASE_URL=postgres://shop:s3cret@db.graph:5432/shop -e REDIS_HOST=cache.graph
name: shop
nodes:
  cache: {image: shop-cache, mem_mib: 128, ports: [6379]}
  db: {image: shop-db, ports: [5432], volumes: [{name: shop-pgdata, mount: /var/lib/postgresql/data}]}
  web: {image: shop-web, ports: [8000]}
edges:
  - {from: web, to: cache, kind: link, port: 6379}
  - {from: web, to: cache, kind: depends}
  - {from: web, to: db, kind: link, port: 5432}
  - {from: web, to: db, kind: depends}
