# Generated by kling graph from-compose. Run these first:
#   kling volume create health-data
#   kling image import example/api:2 -name health-api -replace -e DB_HOST=db.graph -e LOG_LEVEL=info
#   kling image import postgres:16 -name health-db -replace -e PGDATA=/var/lib/postgresql/data/pgdata
name: health
nodes:
  api: {image: health-api, ports: [8081]}
  db: {image: health-db, vcpus: 2, mem_mib: 1024, allow_exec: true, ports: [5432], volumes: [{name: health-data, mount: /var/lib/postgresql/data}]}
edges:
  - {from: api, to: db, kind: link, port: 5432}
  - {from: api, to: db, kind: depends, health: {test: [sh, -c, "pg_isready -U app -p 5432"], interval_ms: 5000, retries: 10}}
  - {from: db, to: api, kind: link, port: 8081}
