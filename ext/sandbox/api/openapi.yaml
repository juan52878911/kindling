openapi: 3.1.0
info:
  title: kindling-sandbox gateway API
  version: v1
  description: |
    API HTTP /v1 del gateway de sandboxes de kindling. Cada ruta pide
    `Authorization: Bearer <token>` salvo `GET /v1/health`.
    El id de un sandbox o grafo es `host/maquina`: lleva una barra dentro y va
    sin codificar en la ruta (`/v1/sandboxes/h1/m-abc/exec`).
servers:
  - url: http://localhost:8088
security:
  - bearer: []
tags:
  - name: sandboxes
  - name: graphs
  - name: volumes
  - name: ops
  - name: tenants
paths:
  /v1/health:
    get:
      tags: [ops]
      summary: Sonda de vida, sin token
      security: []
      responses:
        "200":
          description: Vivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/hosts:
    get:
      tags: [ops]
      summary: Daemons de detrás del gateway (solo token de admin)
      responses:
        "200":
          description: Estado de cada host
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HostEstado"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /v1/metrics:
    get:
      tags: [ops]
      summary: Métricas en formato texto de Prometheus
      description: Un admin ve las series de todos los inquilinos; los demás, las suyas.
      responses:
        "200":
          description: Exposición de Prometheus 0.0.4
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Error"
  /v1/templates:
    get:
      tags: [ops]
      summary: Catálogo de plantillas y en qué hosts están construidas
      responses:
        "200":
          description: Plantillas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TemplateInfo"
        "401":
          $ref: "#/components/responses/Error"
  /v1/templates/{name}/pool:
    put:
      tags: [ops]
      summary: Fija el fondo precalentado de una plantilla en cada host que la tiene (solo admin)
      description: |
        `size` 0 lo apaga. Un host que no contesta no impide fijarlo en los
        demás: su fallo va en `hosts[].error`, y solo si ninguno lo consigue
        la respuesta es 502. Es la ruta que usa el operador de Kubernetes para
        `SandboxPool`.
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: {type: integer, minimum: 0}
      responses:
        "200":
          description: Fondo fijado
          content:
            application/json:
              schema:
                type: object
                properties:
                  template: {type: string}
                  size: {type: integer}
                  available: {type: integer, description: Copias despiertas y reclamables en todos los hosts}
                  hosts:
                    type: array
                    items:
                      type: object
                      properties:
                        host: {type: string}
                        size: {type: integer}
                        ready: {type: integer}
                        error: {type: string}
                        stale: {type: string}
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes:
    get:
      tags: [sandboxes]
      summary: Sandboxes del inquilino
      description: |
        Un host caído no oculta los demás: se devuelve lo que hay y la cabecera
        `X-Kindling-Partial` lista los fallos.

        Sin parámetros devuelve la lista entera. `state` y `label` filtran
        (todas las etiquetas dadas deben casar); con `limit` la respuesta es
        una página ordenada por id y, si hay más, `X-Kindling-Next-Cursor`
        trae el `cursor` de la siguiente.
      parameters:
        - name: state
          in: query
          description: Solo los sandboxes en este estado (created, running, frozen, paused, stopped, failed)
          schema:
            type: string
        - name: label
          in: query
          description: "`clave=valor`; se puede repetir"
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: limit
          in: query
          description: Tamaño de página (1-1000)
          schema:
            type: integer
        - name: cursor
          in: query
          description: El `X-Kindling-Next-Cursor` de la página anterior
          schema:
            type: string
      responses:
        "200":
          description: Lista (puede ir vacía)
          headers:
            X-Kindling-Partial:
              description: Errores de los hosts que no contestaron
              schema:
                type: string
            X-Kindling-Next-Cursor:
              description: Cursor de la página siguiente; ausente en la última
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/Error"
    post:
      tags: [sandboxes]
      summary: Crea un sandbox, o un lote con `count`
      description: |
        Sin `count` crea uno y la respuesta es el sandbox. Con `count` (1 al
        tope del inquilino y del gateway) crea un lote y la respuesta es
        `LoteRespuesta`, aunque `count` sea 1. La cuota (sandboxes, por
        plantilla y memoria total) se cuenta con el lote entero antes de crear
        nada: si no caben todos, 429 y no se crea ninguno. Los sandboxes se
        reparten entre los hosts. Con `atomic` el lote es todo o nada: si uno
        falla se borran los ya creados y la respuesta es el error. Sin `atomic`
        un lote parcial es 207 con los creados y un error por cada uno que no.

        `volumes` monta volúmenes del inquilino (`/v1/volumes`). Uno que existe
        fija el host donde nace el sandbox; dos en hosts distintos son 409; uno
        inexistente o de otro inquilino, 404. Con `clone_from` y un `name`
        nuevo, el volumen se crea clonando otro del inquilino. Un lote solo
        monta volúmenes `read_only` y no admite `clone_from`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearPeticion"
      responses:
        "201":
          description: Creado (un `Sandbox`, o `LoteRespuesta` con `count`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Sandbox"
                  - $ref: "#/components/schemas/LoteRespuesta"
        "207":
          description: Lote parcial (sin `atomic`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoteRespuesta"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/ErrorConReintento"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ErrorConReintento"
  /v1/sandboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      tags: [sandboxes]
      summary: Ve un sandbox
      responses:
        "200":
          description: El sandbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
    delete:
      tags: [sandboxes]
      summary: Destruye un sandbox
      responses:
        "204":
          description: Destruido
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Renueva el TTL
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenovarPeticion"
      responses:
        "200":
          description: Sandbox con el TTL nuevo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/pause:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Pausa un sandbox running sin volcar su memoria
      responses:
        "200":
          description: Sandbox pausado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Reanuda un sandbox pausado o congelado
      responses:
        "200":
          description: Sandbox en marcha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sandbox"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/egress:
    parameters:
      - $ref: "#/components/parameters/id"
    patch:
      tags: [sandboxes]
      summary: Cambia en caliente la política de salida de red
      description: |
        Cuerpo y respuesta son los del daemon (`EgressRequest` y
        `EgressPolicy`): `egress` (none, internet, allowlist) y `allow_domains`.
        `applied` dice si vale ya (`live`), en el próximo arranque
        (`next_start`) o si no cambió (`unchanged`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EgressRequest"
      responses:
        "200":
          description: Política resultante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EgressPolicy"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/endpoints:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Abre una URL HTTP/WebSocket a un puerto del sandbox
      description: |
        Devuelve la URL `<puerto>-<id codificado>.<dominio>` y un token que la
        abre (salvo si es pública). Necesita el gateway con `-ingress-domain`
        (501 si no). El token se puede mandar en `Authorization: Bearer`, en
        `X-Kling-Endpoint-Token` o en `?kling_token=` (una vez: queda en una
        cookie HttpOnly del subdominio). El invitado no ve el token del tenant
        ni el del endpoint. El token no tiene estado: vale hasta que caduca.
        Ver docs/sandbox-api.md (DNS comodín y TLS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndpointPeticion"
      responses:
        "201":
          description: Endpoint creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    get:
      tags: [sandboxes]
      summary: Lista los endpoints públicos vigentes
      description: |
        Solo los públicos: los de token no tienen estado en el gateway (son
        tokens firmados), así que no se pueden listar; sí revocar por puerto.
      responses:
        "200":
          description: Endpoints públicos (puede ir vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endpoint"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/endpoints/{port}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: port
        in: path
        required: true
        schema:
          type: integer
    delete:
      tags: [sandboxes]
      summary: Revoca los endpoints de un puerto
      description: |
        Quita el puerto de los públicos y revoca los tokens de endpoint de ese
        puerto emitidos hasta ahora (una lista de revocaciones por sandbox, en
        una etiqueta interna). Los tokens que se emitan después valen. Un 204
        es verdad en esa réplica del gateway al momento: ni las peticiones en
        curso ni las conexiones abiertas (WebSocket) siguen pasando. Con varias
        réplicas, las demás cortan lo abierto en 5 s como mucho (repaso
        periódico), y una petición nueva que llegue a otra réplica puede ver
        las etiquetas viejas hasta 3 s.
      responses:
        "204":
          description: Revocado
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/exec:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Ejecuta un comando
      description: |
        Por defecto responde un flujo NDJSON (`application/x-ndjson`): una
        línea JSON por evento (`ExecEvent`), vaciada al momento. Los eventos
        `stream`+`data` llevan salida; el último es `exit` (con `duration_ms`,
        `truncated`, `timed_out`) o `error` si el flujo se cortó tras el 200.
        Con `?wait=1` espera al final y devuelve un `ExecResult` JSON.
        Los errores previos al primer evento llegan con su código HTTP y un
        `Error` JSON normales.
      parameters:
        - name: wait
          in: query
          description: "`1` para recibir un ExecResult agregado en vez del flujo"
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecRequest"
      responses:
        "200":
          description: Flujo NDJSON, o ExecResult con `?wait=1`
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ExecEvent"
            application/json:
              schema:
                $ref: "#/components/schemas/ExecResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/code:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Ejecuta código (python, bash o javascript)
      description: |
        `/code` del execd de OpenSandbox. Ejecuta `code` en el contexto
        `context_id` (el estado persiste entre ejecuciones) o, sin él, en uno
        efímero que se borra al acabar. `language` (python por defecto; bash;
        javascript, que necesita `node` en la imagen) no puede contradecir el
        del contexto. La respuesta es un flujo NDJSON de `CodeEvent` que
        SIEMPRE termina en `done`, también si el gateway falla a mitad de
        flujo (entonces, un `error` sin datos del host y `done` con
        `ok:false`). Un error del código llega como evento `error`
        (la respuesta sigue siendo 200). `result` lleva `results` por tipo MIME
        (`text/plain` siempre; `text/html` e `image/png` en base64 si el valor
        tiene `_repr_html_` / `_repr_png_` o es una figura de matplotlib) y
        `execution_count`. Sin el intérprete en la imagen, 422. Código de hasta
        1 MiB (413), plazo por ejecución `timeout_seconds` (60 por defecto,
        600 máximo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeRequest"
      responses:
        "200":
          description: Flujo NDJSON
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/CodeEvent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/code/contexts:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Crea un contexto de código
      description: |
        Un contexto es un proceso de fondo del sandbox que
        guarda las variables entre ejecuciones. Tope de 8 por sandbox (429).
        Sin el intérprete del lenguaje en la imagen, 422.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeContextRequest"
      responses:
        "201":
          description: Contexto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeContext"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    get:
      tags: [sandboxes]
      summary: Lista los contextos de código del sandbox
      responses:
        "200":
          description: Contextos vivos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodeContext"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/code/contexts/{cid}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: cid
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [sandboxes]
      summary: Ve un contexto de código
      responses:
        "200":
          description: El contexto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeContext"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    delete:
      tags: [sandboxes]
      summary: Borra un contexto de código y mata su proceso
      responses:
        "204":
          description: Borrado
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/code/contexts/{cid}/execution:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: cid
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [sandboxes]
      summary: Interrumpe la ejecución en curso de un contexto
      description: |
        Manda SIGINT al conductor del contexto: la ejecución acaba con un
        evento `error` (`KeyboardInterrupt`) y `done` con `ok:false`. El
        contexto y su estado siguen. Sin ejecución en curso, no hace nada.
      responses:
        "204":
          description: Señal enviada
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/processes:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Lanza un proceso en segundo plano
      description: |
        Devuelve enseguida el `pid` (del sandbox, no del SO). El proceso sigue
        vivo aunque el cliente se desconecte; su salida se lee con
        `/processes/{pid}/output`. Con `session` corre en el cwd y el entorno
        de esa sesión. Tope de procesos vivos por sandbox (429).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessStartRequest"
      responses:
        "201":
          description: Proceso lanzado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInfo"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    get:
      tags: [sandboxes]
      summary: Lista los procesos de fondo del sandbox
      responses:
        "200":
          description: Procesos, vivos y terminados aún no borrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcessInfo"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/processes/{pid}:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: pid
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [sandboxes]
      summary: Estado de un proceso
      parameters:
        - name: wait
          in: query
          description: Segundos (máx. 300) que espera a que el proceso termine
          schema:
            type: integer
      responses:
        "200":
          description: Estado; sigue en `running` si no terminó en el plazo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessInfo"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
