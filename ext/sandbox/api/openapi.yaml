  /v1/sandboxes/{id}/shell:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      tags: [sandboxes]
      summary: Terminal interactiva (upgrade a kling-shell/1)
      description: |
        Hay que pedir `Upgrade: kling-shell/1` (y `Connection: Upgrade`); sin
        él, 426. El cuerpo JSON es un `ShellRequest` (puede ir vacío). Si todo
        va bien responde `101 Switching Protocols` y la conexión TCP pasa a
        hablar tramas binarias en ambos sentidos:

        `tipo (1 byte) | longitud (uint32 big-endian) | carga (≤ 65536 bytes)`

        Tipos: `0` datos (stdin hacia dentro, salida del PTY hacia fuera);
        `1` resize (rows uint16, cols uint16; solo hacia dentro);
        `2` señal (número de señal; solo hacia dentro); `3` exit
        (código int32; siempre la última hacia fuera); `4` error (texto
        UTF-8; también la última); `5` ping (vacía, del servidor al cliente).
        El inquilino tiene un tope de sesiones de shell abiertas (429).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShellRequest"
      responses:
        "101":
          description: Cambio de protocolo a kling-shell/1
          headers:
            Upgrade:
              schema:
                type: string
                const: kling-shell/1
            Connection:
              schema:
                type: string
                const: Upgrade
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
  /v1/sandboxes/{id}/files:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: path
        in: query
        required: true
        description: Ruta absoluta del fichero dentro del sandbox
        schema:
          type: string
    get:
      tags: [sandboxes]
      summary: Descarga un fichero, con `stat=1` sus metadatos, o con `list=1` el listado del directorio
      parameters:
        - name: stat
          in: query
          description: "`1` para devolver un FileStat JSON en vez del contenido"
          schema:
            type: string
            enum: ["1"]
        - name: list
          in: query
          description: "`1` para listar el directorio `path` (FileList JSON)"
          schema:
            type: string
            enum: ["1"]
        - name: tar
          in: query
          description: "`1` para descargar el directorio `path` como tar"
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: |
            Contenido (se corta en 256 MiB), FileStat o FileList. Con la
            cabecera `Range: bytes=a-b` (un solo rango) devuelve el trozo
            con 206 y `Content-Range`; fuera del fichero, 416. `?tar=1`
            devuelve el directorio como tar.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/FileStat"
                  - $ref: "#/components/schemas/FileList"
        "206":
          description: |
            Trozo pedido con `Range: bytes=a-b`; lleva `Content-Range`. No se
            sirve más allá de los primeros 256 MiB del fichero.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "416":
          description: |
            El rango empieza fuera del fichero o más allá de los 256 MiB
            descargables; `Content-Range: bytes */tamaño`.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    put:
      tags: [sandboxes]
      summary: Sube un fichero (cuerpo crudo, hasta 64 MiB)
      parameters:
        - name: mode
          in: query
          description: Permisos en octal, p. ej. `0644`
          schema:
            type: string
            pattern: "^[0-7]+$"
        - name: mkdir
          in: query
          description: "`1` crea los directorios que falten"
          schema:
            type: string
            enum: ["1"]
        - name: tar
          in: query
          description: |
            `1`: el cuerpo es un tar que se extrae dentro del directorio
            `path`; responde un TarResult. El invitado rechaza entradas con
            `..`, absolutas, enlaces que salen o dispositivos.
          schema:
            type: string
            enum: ["1"]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 67108864
      responses:
        "200":
          description: Fichero escrito
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileStat"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
    delete:
      tags: [sandboxes]
      summary: Borra un fichero
      responses:
        "204":
          description: Borrado
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
