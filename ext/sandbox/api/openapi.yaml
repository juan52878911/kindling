          description: Creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Nombre del inquilino (no cambia nunca)
        schema:
          type: string
    get:
      tags: [tenants]
      summary: Ve un inquilino (solo admin)
      responses:
        "200":
          description: El inquilino, con la ficha de sus claves
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      tags: [tenants]
      summary: Cambia admin y/o topes de un inquilino del almacén (solo admin)
      description: |
        `limits` sustituye todos los topes (los omitidos vuelven a 0). Los del
        entorno son de solo lectura (409), y un admin no puede quitarse el rol.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CambiarTenantPeticion"
      responses:
        "200":
          description: Cambiado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
    delete:
      tags: [tenants]
      summary: Borra un inquilino del almacén y todas sus claves (solo admin)
      description: Sus sandboxes siguen vivos hasta su TTL; sin clave nadie los alcanza.
      responses:
        "204":
          description: Borrado
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/keys:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [tenants]
      summary: Crea una clave; la devuelve UNA sola vez (solo admin)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearClavePeticion"
      responses:
        "201":
          description: La clave en claro está en `key` y no se puede volver a leer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaveCreada"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/keys/{kid}/rotate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kid
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [tenants]
      summary: Rota una clave (solo admin)
      description: |
        Crea una clave nueva y deja la vieja válida `grace_minutes` más (10 por
        defecto, máximo 1440; 0 = deja de valer ya).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RotarClavePeticion"
      responses:
        "201":
          description: La clave nueva en claro (una sola vez) y cuándo caduca la vieja
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaveCreada"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /v1/tenants/{id}/keys/{kid}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kid
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [tenants]
      summary: Revoca una clave al instante (solo admin; repetirlo no falla)
      responses:
        "204":
          description: Revocada
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Token de inquilino (sandboxes, grafos, plantillas, métricas propias) o
        de admin (además `/v1/hosts` y las métricas de todos). Sin token o con
        uno inválido: 401 con `WWW-Authenticate: Bearer realm="kindling-sandbox"`.
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Id `host/maquina`; la barra va sin codificar
      schema:
        type: string
      allowReserved: true
  responses:
    Error:
      description: Error. El código HTTP manda; `message` es para personas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ErrorConReintento:
      description: |
        Error con `Retry-After` (segundos). En el 429 de cuota al crear es un
        intervalo corto de sondeo (5): la cuota se libera cuando un sandbox
        se borra o vence su TTL, y el frontal no puede predecir cuándo. En el
        503 de plantilla reconstruyéndose son 60 (el 503 de cuota que no se
        puede contar, con un host sin contestar, no lo lleva).
      headers:
        Retry-After:
          description: Segundos que esperar antes de reintentar.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string
          description: |
            Código estable, siempre presente: el del daemon si lo trae
            (no_claimable, machine_limit, name_taken...) y, si no, el del
            estado HTTP (bad_request, unauthorized, forbidden, not_found,
            method_not_allowed, conflict, too_many_requests, bad_gateway...).
            En los flujos NDJSON, un fallo tras el 200 sale como evento
            `error` sin datos internos del host.
    MoverPeticion:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
        to:
          type: string
        overwrite:
          type: boolean
          description: Pisa el destino si existe; sin él, un destino que existe es un 409
    MetadatosPeticion:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
        remove:
          type: array
          items:
            type: string
    ForkPeticion:
      type: object
      properties:
        count:
          type: integer
        ttl_seconds:
          type: integer
    ForkRespuesta:
      type: object
      required: [sandboxes]
      properties:
        sandboxes:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
    Metricas:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        memory_mib:
          type: integer
        memory_kind:
          type: string
          description: "`pss` (Linux) o `footprint` (macOS)"
        cpu_seconds:
          type: number
        mem_limit_mib:
          type: integer
    ChmodPeticion:
      type: object
      required: [path, mode]
      properties:
        path:
          type: string
        mode:
          type: string
          description: Octal de 3 o 4 cifras (`755`, `0644`)
        recursive:
          type: boolean
    ReemplazarPeticion:
      type: object
      required: [path, old, new]
      properties:
        path:
          type: string
        old:
          type: string
        new:
          type: string
        all:
          type: boolean
    ReemplazarRespuesta:
      type: object
      properties:
        path:
          type: string
        replacements:
          type: integer
        size:
          type: integer
    MkdirPeticion:
      type: object
      required: [path]
      properties:
        path:
          type: string
    BusquedaFicheros:
      type: object
      properties:
        path:
          type: string
        glob:
          type: string
        matches:
          type: array
          items:
            type: string
        truncated:
          type: boolean
    Health:
      type: object
      properties:
        ok:
          type: boolean
    HostEstado:
      type: object
      properties:
        name:
          type: string
        endpoint:
          type: string
        alive:
          type: boolean
        version:
          type: string
        machines:
          type: integer
        available_mib:
          type: integer
        error:
          type: string
    TemplateHost:
      type: object
      properties:
        host:
          type: string
        snapshot:
          type: string
        built_at:
          type: string
          format: date-time
        recipe_sha256:
          type: string
        instances:
          type: integer
    TemplateInfo:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          description: '"graph" en una plantilla de grafo; ausente en una de máquina'
        hosts:
          type: array
          items:
            $ref: "#/components/schemas/TemplateHost"
    EndpointPeticion:
      type: object
      required: [port]
      properties:
        port:
          type: integer
          description: Puerto del invitado (1-65535; el del agente no se publica)
        ttl_seconds:
          type: integer
          description: Vida del endpoint, hasta 604800 (7 días). 0 = 3600
        public:
          type: boolean
          description: Sin token. Se guarda en una etiqueta interna del sandbox hasta que caduca
    Endpoint:
      type: object
      properties:
        url:
          type: string
        port:
          type: integer
        token:
          type: string
          description: Ausente si el endpoint es público
        public:
          type: boolean
        expires_at:
          type: string
          format: date-time
    Sandbox:
      type: object
      properties:
        id:
          type: string
        host:
          type: string
        template:
          type: string
        image:
          type: string
        state:
          type: string
        vcpus:
          type: integer
        mem_mib:
          type: integer
        egress:
          type: string
        allow_domains:
          type: array
          items:
            type: string
        on_ttl:
          type: string
        ttl_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        labels:
          type: object
          additionalProperties:
            type: string
    CrearPeticion:
      type: object
      properties:
        template:
          type: string
        image:
          type: string
        ttl_seconds:
          type: integer
        on_ttl:
          type: string
        egress:
          type: string
        allow_domains:
          type: array
          items:
            type: string
        mem_mib:
          type: integer
        vcpus:
          type: integer
        labels:
          type: object
          additionalProperties:
            type: string
        env:
          type: object
          additionalProperties:
            type: string
          description: |
            Variables de entorno (hasta 64, 32 KiB). Valen para todo lo que se
            ejecute en el sandbox sin sesión propia: `exec`, procesos de fondo,
            `/code` y `/shell`. Se guardan como la sesión `default`, que cada uso
            renueva (caduca tras 24 h sin uso; si caduca, el sandbox sigue
            sirviendo, ya sin ellas). No admitido junto con `count`.
        count:
          type: integer
          minimum: 1
          description: Crea un lote de este tamaño (respuesta `LoteRespuesta`)
        atomic:
          type: boolean
          description: Con `count`, todo o nada
        volumes:
          type: array
          items:
            $ref: "#/components/schemas/VolumenPeticion"
    VolumenPeticion:
      type: object
      required: [name, mount]
      properties:
        name:
          type: string
        mount:
          type: string
          description: Ruta absoluta dentro del sandbox
        read_only:
          type: boolean
        clone_from:
          type: string
          description: Si `name` no existe, lo crea clonando este volumen propio
    Volumen:
      type: object
      properties:
        name:
          type: string
        host:
          type: string
        size_mib:
          type: integer
        used_bytes:
          type: integer
        in_use:
          type: boolean
    CrearVolumenPeticion:
      type: object
      required: [name]
      properties:
        name:
          type: string
        size_mib:
          type: integer
        clone_from:
          type: string
        host:
          type: string
    LoteRespuesta:
      type: object
      properties:
        sandboxes:
          type: array
          items:
            $ref: "#/components/schemas/Sandbox"
        errors:
          type: array
          items:
            $ref: "#/components/schemas/LoteError"
    LoteError:
      type: object
      properties:
        index:
          type: integer
        status:
          type: integer
        error:
          type: string
    RenovarPeticion:
      type: object
      properties:
        ttl_seconds:
          type: integer
    EgressRequest:
      type: object
      properties:
        egress:
          type: string
        allow_domains:
          type: array
          items:
            type: string
    EgressPolicy:
      type: object
      properties:
        egress:
          type: string
        allow_domains:
          type: array
          items:
            type: string
        applied:
          type: string
          enum: [live, next_start, unchanged]
        narrowed:
          type: boolean
        connections_closed:
          type: boolean
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          items:
            type: string
        dir:
          type: string
        env:
          type: array
          items:
            type: string
        stdin:
          type: string
          format: byte
        timeout_seconds:
          type: integer
        max_output_bytes:
          type: integer
        user:
          type: string
        session:
          type: string
          description: Sesión cuyo cwd y entorno se usan (ver `/sessions`)
    ProcessStartRequest:
      type: object
      required: [cmd]
      properties:
        cmd:
          type: array
          items:
            type: string
        dir:
          type: string
        env:
          type: array
          items:
            type: string
        user:
          type: string
        session:
          type: string
        timeout_seconds:
          type: integer
        max_output_bytes:
          type: integer
    CodeContextRequest:
      type: object
      properties:
        language:
          type: string
          enum: [python, bash, javascript]
        cwd:
          type: string
          description: Directorio de trabajo (vacío = el del agente)
    CodeContext:
      type: object
      properties:
        id:
          type: string
        language:
          type: string
        pid:
          type: integer
          description: pid del proceso del contexto (en /processes)
        cwd:
          type: string
        started_at:
          type: string
          format: date-time
    CodeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
        context_id:
          type: string
          description: Vacío = contexto efímero
        language:
          type: string
          enum: [python, bash, javascript]
        timeout_seconds:
          type: integer
          description: Plazo por ejecución (60 por defecto, 600 máximo)
    CodeEvent:
      type: object
      description: |
        `stdout` y `stderr` traen `text`; `result` el `repr` del valor de la
        última expresión (`text`) y sus `results` por tipo MIME; `error`,
        `ename`, `evalue` y `traceback`; `done` (`ok`, `duration_ms`) cierra el
        flujo, siempre. `execution_count` cuenta las ejecuciones del contexto.
      required: [type]
      properties:
        type:
          type: string
          enum: [stdout, stderr, result, error, done]
        text:
          type: string
        ename:
          type: string
        evalue:
          type: string
        traceback:
          type: array
          items:
            type: string
        ok:
          type: boolean
        duration_ms:
          type: integer
        results:
          type: object
          additionalProperties:
            type: string
          description: Por tipo MIME; `image/png` va en base64
        execution_count:
          type: integer
    ProcessInfo:
      type: object
      properties:
        pid:
          type: integer
        cmd:
          type: array
          items:
            type: string
        dir:
          type: string
        state:
          type: string
          enum: [running, exited]
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        exit_code:
          type: integer
        signal:
          type: string
        timed_out:
          type: boolean
        output_bytes:
          type: integer
        output_start:
          type: integer
    ProcessEvent:
      type: object
      description: Una línea del flujo de salida. `data` va en base64; `offset` es el siguiente al trozo.
      properties:
        stream:
          type: string
          enum: [stdout, stderr]
        data:
          type: string
          format: byte
        offset:
          type: integer
        dropped:
          type: integer
        exit:
          type: integer
        signal:
          type: string
        error:
          type: string
    ProcessSignalRequest:
      type: object
      properties:
        signal:
          type: string
          description: Nombre (TERM, KILL, HUP...); vacía = TERM
    SessionRequest:
      type: object
      properties:
        id:
          type: string
        dir:
          type: string
        env:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
    Session:
      type: object
      properties:
        id:
          type: string
        dir:
          type: string
        env:
          type: array
          items:
            type: string
        unset:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        execs:
          type: integer
    ExecEvent:
      type: object
      description: Una línea del flujo NDJSON. `data` va en base64.
      properties:
        stream:
          type: string
          enum: [stdout, stderr]
        data:
          type: string
          format: byte
        exit:
          type: integer
        duration_ms:
          type: integer
        truncated:
          type: boolean
        timed_out:
          type: boolean
        error:
          type: string
    ExecResult:
      type: object
      properties:
        exit_code:
          type: integer
        stdout:
          type: string
          format: byte
        stderr:
          type: string
          format: byte
        duration_ms:
          type: integer
        truncated:
          type: boolean
        timed_out:
          type: boolean
    ShellRequest:
      type: object
      properties:
        cmd:
          type: array
          items:
            type: string
        dir:
          type: string
        env:
          type: array
          items:
            type: string
        term:
          type: string
        rows:
          type: integer
        cols:
          type: integer
    FileStat:
      type: object
      properties:
        path:
          type: string
        size:
          type: integer
        mode:
          type: string
        is_dir:
          type: boolean
        mod_time:
          type: string
          format: date-time
    FileEntry:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [file, dir, symlink, other]
        size:
          type: integer
        mode:
          type: string
        mod_time:
          type: string
          format: date-time
        target:
          type: string
    FileList:
      type: object
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FileEntry"
        truncated:
          type: boolean
    NodoGrafo:
      type: object
      properties:
        id:
          type: string
        state:
          type: string
        ports:
          type: array
          items:
            type: integer
    Grafo:
      type: object
      properties:
        id:
          type: string
        host:
          type: string
        template:
          type: string
        state:
          type: string
        claimed_at:
          type: string
          format: date-time
        nodes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/NodoGrafo"
    CrearGrafoPeticion:
      type: object
      required: [template]
      properties:
        template:
          type: string
    TopesTenant:
      type: object
      description: Topes del inquilino; 0 u omitido = el valor por defecto del gateway
      properties:
        max_sandboxes:
          type: integer
        max_per_template:
          type: integer
        max_shells:
          type: integer
        max_processes:
          type: integer
        max_sessions:
          type: integer
        max_follow:
          type: integer
        max_mem_mib:
          type: integer
        max_vcpus:
          type: integer
        max_mem_total_mib:
          type: integer
        max_batch:
          type: integer
        max_volumes:
          type: integer
    ClaveTenant:
      type: object
      description: Ficha de una clave (sin el secreto ni su hash)
      properties:
        id:
          type: string
        prefix:
          type: string
        created:
          type: string
          format: date-time
        expires:
          type: string
          format: date-time
        revoked:
          type: string
          format: date-time
        last_used:
          type: string
          format: date-time
    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        source:
          type: string
          enum: [store, env]
        read_only:
          type: boolean
        admin:
          type: boolean
        limits:
          $ref: "#/components/schemas/TopesTenant"
        created:
          type: string
          format: date-time
        keys:
          type: array
          items:
            $ref: "#/components/schemas/ClaveTenant"
    CrearTenantPeticion:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Letras, dígitos, '.', '_' y '-'; es el id y no cambia
        admin:
          type: boolean
        limits:
          $ref: "#/components/schemas/TopesTenant"
    CambiarTenantPeticion:
      type: object
      properties:
        admin:
          type: boolean
        limits:
          $ref: "#/components/schemas/TopesTenant"
    CrearClavePeticion:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
    RotarClavePeticion:
      type: object
      properties:
        grace_minutes:
          type: integer
    ClaveCreada:
      type: object
      description: Única respuesta que lleva una clave en claro
      properties:
        id:
          type: string
        prefix:
