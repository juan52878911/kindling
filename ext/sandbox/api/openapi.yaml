  /v1/sandboxes/{id}/processes/{pid}/output:
    parameters:
      - $ref: "#/components/parameters/id"
      - name: pid
        in: path
        required: true
        schema:
          type: integer
    get:
      tags: [sandboxes]
      summary: Salida del proceso (NDJSON)
      description: |
        Flujo NDJSON de `ProcessEvent` desde `offset`. Cada trozo trae el
        `offset` siguiente para reanudar. Con `follow=1` sigue hasta que el
        proceso termina y acaba con un evento `exit`; sin él vuelca lo que hay.
        El último evento siempre lleva el `offset` desde el que continuar. Tope
        de lecturas con follow abiertas por inquilino (429).
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
        - name: follow
          in: query
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Flujo NDJSON
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ProcessEvent"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
