# Deployment de ejemplo. Una sola réplica: dos operadores reconciliando el
# mismo Sandbox a la vez no rompen nada grave (crear es idempotente por
# status.id, borrar tolera el 404), pero duplicarían trabajo sin motivo. Si
# hace falta alta disponibilidad, esto pide un lease de liderazgo — que este
# operador, a propósito, no trae: es fino y de un solo proceso.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kindling-operator
  namespace: kindling-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kindling-operator
  template:
    metadata:
      labels:
        app: kindling-operator
    spec:
      serviceAccountName: kindling-operator
      # El operador no escribe en disco ni necesita privilegio alguno: solo
      # lee el token de la cuenta de servicio y habla HTTP. 65532 es el
      # usuario nonroot de distroless/static (Dockerfile.operator).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # El tag tiene que coincidir con la versión de kindling desplegada
          # en el clúster (operador y frontal viajan juntos en el release
          # unificado). La de aquí es la última release al escribirla: el
          # kindling-operator-deploy.tar.gz de cada release la lleva cambiada
          # por la suya (release.yml), así que desplegar desde el tar no pide
          # tocarla.
          image: ghcr.io/juan52878911/kindling-operator:v1.0.0-rc.2
          # Sin flags: dentro del clúster, KUBERNETES_SERVICE_HOST/PORT y la
          # cuenta de servicio ya dan todo lo que hace falta para hablar con
          # el API de Kubernetes. La URL y el token del frontal SÍ van por
          # entorno, nunca por flag ni horneados en la imagen.
          env:
            - name: KLING_SANDBOX_URL
              value: "https://sandbox.kindling.example.internal"
            - name: KLING_SANDBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kindling-operator-frontal
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
